version: '3.8'

services:
  web-service:
    build: ./web-app
    container_name: custom_web_app
    ports:
      - "8098:8098"

  nginx-service:
    image: nginx:alpine
    container_name: ready_nginx_app
    ports:
      - "80:80"

  client-service:
    build: ./client-app
    container_name: python_client
    depends_on:
      - web-service